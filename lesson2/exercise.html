<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .github-button{
            background-color:rgb(46,164,79);
            color: rgb(255,255,255);
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 8px;
            cursor: pointer;
            margin-right: 8px;
        }
        .uber-button{
            background-color:black;
            color: rgb(255,255,255);
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }
        .amazon-button{
            background-color:rgb(255,216,20);
            color: black;
            border: none;
            height: 30px;
            width: 130px;
            border-radius: 18px;
            cursor: pointer;
            margin-right: 8px;
        }
        </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="uber-button">Request now</button> <br><br>
    <button class="amazon-button">Add to Cart</button><br><br>
    <button class="github-button">Sign up</button><br><br>
</body>
</html>
