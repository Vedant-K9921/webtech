<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .subscriber-button{
            background-color: red;
            color: rgb(255,255,255);
            border: none;
            height: 36px;
            width: 105px;
            border-radius: 2px;
            cursor: pointer;
            margin-right: 8px;
        }
        .join-button{
            background-color: white;
            border-color: rgb(41,56,78);
            border-style: solid;
            border-width: 1px;
            color: rgb(41,118,211);
            height: 36px;
            width: 62px;
            border-radius: 2px;
            cursor: pointer;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button class="subscriber-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">TWEET</button>
</body>
</html>
